name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 是 README 里声明的最低支持版本。整体用 ubuntu-latest 跑新版本，
          # 3.8 固定在仍提供该版本运行时的 ubuntu-22.04 上验证，避免镜像不再预装导致误红。
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 1. 语法检查：确认脚本在声明的最低版本上也能编译
      - name: 校验脚本可编译
        shell: bash
        run: python -m compileall -q sync_tokens.py

      # 2. 演示路径：不读本机任何日志，是最适合 CI 的入口
      - name: 生成脱敏演示报表（--sample）
        shell: bash
        run: python sync_tokens.py --sample

      - name: 校验演示报表产物
        shell: bash
        run: |
          set -euo pipefail
          test -s dashboard.sample.html || { echo "::error::未生成 dashboard.sample.html"; exit 1; }
          grep -q "本地 AI Token 账本" dashboard.sample.html || { echo "::error::报表内容异常"; exit 1; }
          size=$(wc -c < dashboard.sample.html)
          echo "dashboard.sample.html: ${size} bytes"
          test "${size}" -gt 10000 || { echo "::error::报表体积过小，疑似渲染失败"; exit 1; }

      # 3. 空环境全量扫描：runner 上没有 Codex / Claude Code / Cursor 日志，
      #    这条用例专门守住 README 的承诺——工具缺失时跳过而不是报错。
      - name: 空环境全量扫描
        shell: bash
        run: python sync_tokens.py

      - name: 校验扫描产物与 JSON 结构
        shell: bash
        run: |
          set -euo pipefail
          test -s data/usage.json || { echo "::error::未生成 data/usage.json"; exit 1; }
          test -s dashboard.html || { echo "::error::未生成 dashboard.html"; exit 1; }
          python -c "import json,pathlib;d=json.loads(pathlib.Path('data/usage.json').read_text(encoding='utf-8'));assert isinstance(d.get('daily'),list),'daily 应为列表';assert isinstance(d.get('tools'),dict),'tools 应为字典';print('usage.json OK:',len(d['daily']),'天 /',len(d['tools']),'个工具')"

      # 4. 隐私回归：脚本必须保持零网络调用
      - name: 校验零网络依赖
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*(import|from)[[:space:]]+(requests|aiohttp|httpx|urllib|http|socket|ftplib|telnetlib|smtplib)\b' sync_tokens.py; then
            echo "::error::检测到网络相关导入，本项目承诺全程离线"
            exit 1
          fi
          echo "未发现网络相关导入"
